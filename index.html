<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="src/images/favicon-32x32.png">
  <title>Advice generator app</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/css/reset.css">
  <link rel="stylesheet" href="src/css/variable.css">
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <main class="main">
    <div class="advice-container">
      <h1>advice <span class="advice-id">#117</span></h1>

      <p class="advice">It is easy to sit and take notice, what's difficult is getting up and taking action.</p>

      <picture>
        <source srcset="src/images/pattern-divider-mobile.svg" media="(max-width: 475px)" type="">
  
        <img src="src/images/pattern-divider-desktop.svg" alt="">
      </picture>

      <button class="btn">
        <img src="src/images/icon-dice.svg" alt="">
      </button>
    </div>
  </main>
  
  <script src="src/js/index.js"></script>
</body>
</html>
